openapi: 3.0.0
info:
    title: ZimRate Rest Api Documentation
    description: Documentation for the ZimRate Rest Api.
    version: 1.1.0
servers:
    - url: https://zimrate.tyganeutronics.com/api
      description: Production Server.
    - url: http://localhost:5000/api
      description: Local Firebase emulator.
components:
    schemas:
        Rate:
            properties:
                name:
                    type: string
                    description: The name of the rate provider.
                currency:
                    type: string
                    description: The currency code of the rate (e.g. ZWG, ZAR). All rates are expressed per 1 USD.
                url:
                    type: string
                    description: The source url the rate was obtained.
                rate:
                    type: number
                    description: The actual rate.
                last_rate:
                    type: number
                    description: The previously scanned rate.
                last_checked:
                    type: number
                    description: The date the rate was last updated on source site.
                last_updated:
                    type: number
                    description: The date the rate was last updated.
        V2Response:
            type: object
            properties:
                base:
                    type: string
                    example: ZAR
                    description: The base currency every rate in this response is expressed against.
                rates:
                    type: array
                    items:
                        $ref: '#/components/schemas/Rate'
                    description: >-
                        Rates expressed per 1 unit of the base currency. The base
                        currency itself is not included, as its rate against itself is
                        always 1.
                info:
                    type: string
                    description: System notice message. Omitted when the info parameter is false.
        Error:
            type: object
            properties:
                status:
                    type: boolean
                    example: false
                    description: Always false on an error response.
                message:
                    type: string
                    description: Human readable description of what went wrong.
    examples:
        V1Rates:
            summary: Every rate, against the US dollar
            value:
                USD:
                    - currency: ZWG
                      name: Zim price check - Liquid Home
                      url: https://zimpricecheck.com/price-updates/official-and-black-market-exchange-rates/
                      rate: 26.5
                      last_checked: 1793358035
                      last_updated: 1793358035
                    - currency: ZAR
                      name: Zim price check - CROSS RATES AGAINST ZIG
                      url: https://zimpricecheck.com/price-updates/official-and-black-market-exchange-rates/
                      rate: 16.647704
                      last_checked: 1793358035
                      last_updated: 1793358035
                info: ZimRate API - Real-time Zimbabwe exchange rates
        V2Rates:
            summary: Every rate, against the South African rand
            value:
                base: ZAR
                rates:
                    - currency: ZWG
                      name: Zim price check - Liquid Home
                      url: https://zimpricecheck.com/price-updates/official-and-black-market-exchange-rates/
                      rate: 1.5918
                      last_rate: 1.5918
                      last_checked: 1793358035
                      last_updated: 1793358035
                    - currency: BWP
                      name: Zim price check - CROSS RATES AGAINST ZIG
                      url: https://zimpricecheck.com/price-updates/official-and-black-market-exchange-rates/
                      rate: 0.8073
                      last_rate: 0.8073
                      last_checked: 1793358035
                      last_updated: 1793358035
                info: ZimRate API - Real-time Zimbabwe exchange rates
        InvalidParameter:
            summary: A parameter failed validation
            value:
                status: false
                message: '"prefer" must be one of [min, max, mean, median, random, mode, MIN, MAX, MEAN, MEDIAN, RANDOM, MODE]'
        UnusableBase:
            summary: The base currency has no usable rate
            value:
                status: false
                message: Base currency rate for ZWL is zero or unavailable

paths:
    /v1:
        get:
            tags:
                - Rate
            summary: Get All Rates.
            description: >-
                Get all rates in the system, returned against the US dollar. Version 2
                is also available and lets you choose the base currency. Both versions
                are fully supported.
            parameters:
                - in: query
                  name: search
                  example: RBZ
                  description: Search for a rate by name. Cannot be used with 'name' or 'source' parameters.
                  schema:
                      type: string
                - in: query
                  name: name
                  example: RBZ
                  description: Filter rates by name. Cannot be used with 'search' or 'source' parameters.
                  schema:
                      type: string
                - in: query
                  name: date
                  description: Return rates last updated after this specific date. Uses Unix timestamp format.
                  schema:
                      type: number
                - in: query
                  name: currency
                  example: RBZ
                  description: Filter rates by currency, given as an ISO 4217 code. A currency with no rates returns an empty list rather than an error.
                  schema:
                      type: string
                - in: query
                  name: prefer
                  example: MIN
                  description: Aggregate rates by currency.
                  schema:
                      type: string
                      enum:
                          - MIN
                          - MAX
                          - MEAN
                          - MEDIAN
                          - MODE
                          - RANDOM
                - in: query
                  name: callback
                  example: callback
                  description: JSONP callback function name. When provided, response will be in JSONP format.
                  schema:
                      type: string
                - in: query
                  name: extra
                  example: true
                  description: Whether to include last_rate in the result.
                  schema:
                      type: boolean
                - in: query
                  name: info
                  example: true
                  description: Whether to include system notice information in the response.
                  schema:
                      type: boolean
                - in: query
                  name: source
                  example: RBZ
                  description: Filter rates by source. Deprecated, use 'name' instead. Cannot be used with 'search' or 'name' parameters.
                  schema:
                      type: string
            responses:
                '200':
                    description: An object with the rates and notice message.
                    headers:
                        Content-Type:
                            schema:
                                type: string
                                oneOf:
                                    - type: string
                                      description: 'Content-Type: application/json'
                                      example: application/json
                                    - type: string
                                      description: 'Content-Type: application/javascript'
                                      example: application/javascript
                        Access-Control-Allow-Origin:
                            schema:
                                type: string
                                example: '*'
                                description: 'Access-Control-Allow-Origin: *'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    info:
                                        type: string
                                        description: System notice message. Only included when info parameter is true.
                                    USD:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Rate'
                            examples:
                                rates:
                                    $ref: '#/components/examples/V1Rates'
                        application/javascript:
                            schema:
                                type: string
                                example: 'callback({...});'
                                description: 'callback({...});'
                '400':
                    description: A parameter failed validation - for example passing 'search' together with 'name'.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                error:
                                    $ref: '#/components/examples/InvalidParameter'
                '500':
                    description: Unexpected server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            tags:
                - Rate
            summary: Get All Rates.
            description: >-
                Get all rates in the system, returned against the US dollar. Version 2
                is also available and lets you choose the base currency. Both versions
                are fully supported.
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            properties:
                                search:
                                    type: string
                                    example: RBZ
                                    description: Search for a rate by name. Cannot be used with 'name' or 'source' parameters.
                                name:
                                    type: string
                                    example: RBZ
                                    description: Filter rates by name. Cannot be used with 'search' or 'source' parameters.
                                date:
                                    type: number
                                    description: Return rates last updated after this specific date. Uses Unix timestamp format.
                                currency:
                                    type: string
                                    example: RBZ
                                    description: Filter rates by currency, given as an ISO 4217 code. A currency with no rates returns an empty list rather than an error.
                                prefer:
                                    type: string
                                    example: MIN
                                    description: Aggregate rates by currency.
                                    enum:
                                        - MIN
                                        - MAX
                                        - MEAN
                                        - MEDIAN
                                        - MODE
                                        - RANDOM
                                callback:
                                    type: string
                                    example: callback
                                    description: JSONP callback function name. When provided, response will be in JSONP format.
                                extra:
                                    type: boolean
                                    example: true
                                    description: Whether to include last_rate in the result.
                                info:
                                    type: boolean
                                    example: true
                                    description: Whether to include system notice information in the response.
                                source:
                                    type: string
                                    example: RBZ
                                    description: Filter rates by source. Deprecated, use 'name' instead. Cannot be used with 'search' or 'name' parameters.

            responses:
                '200':
                    description: An object with the rates and notice message.
                    headers:
                        Content-Type:
                            schema:
                                type: string
                                oneOf:
                                    - type: string
                                      description: 'Content-Type: application/json'
                                      example: application/json
                                    - type: string
                                      description: 'Content-Type: application/javascript'
                                      example: application/javascript
                        Access-Control-Allow-Origin:
                            schema:
                                type: string
                                example: '*'
                                description: 'Access-Control-Allow-Origin: *'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    info:
                                        type: string
                                        description: System notice message. Only included when info parameter is true.
                                    USD:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Rate'
                            examples:
                                rates:
                                    $ref: '#/components/examples/V1Rates'
                        application/javascript:
                            schema:
                                type: string
                                example: 'callback({...});'
                                description: 'callback({...});'
                '400':
                    description: A parameter failed validation - for example passing 'search' together with 'name'.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                error:
                                    $ref: '#/components/examples/InvalidParameter'
                '500':
                    description: Unexpected server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v2/{base}:
        get:
            tags:
                - Rate
            summary: Get All Rates.
            description: >-
                Get all rates in the system, returned against a base currency of your
                choosing. Every rate carries its full detail. Both versions are fully
                supported.


                The base currency goes in the url, for example /v2/ZAR, and is case
                insensitive. Use /v2/USD for rates against the US dollar. Where several
                sources quote the base currency their mean is used, and the base
                currency is not included in the results, as its rate against itself is
                always 1.
            parameters:
                - in: path
                  name: base
                  required: true
                  example: ZAR
                  description: >-
                      ISO 4217 code of the currency every rate is returned against, as a
                      path segment. Case insensitive, so /v2/zar and /v2/ZAR are
                      equivalent. A currency with no rates returns an empty list rather
                      than an error.
                  schema:
                      type: string
                - in: query
                  name: currency
                  example: ZWG
                  description: Return only this currency, given as an ISO 4217 code. A currency with no rates returns an empty list rather than an error.
                  schema:
                      type: string
                - in: query
                  name: search
                  example: RBZ
                  description: Filter rates by name, matching any part of it. Cannot be used with 'name'.
                  schema:
                      type: string
                - in: query
                  name: name
                  example: RBZ
                  description: Alias of 'search'. Cannot be used with 'search'.
                  schema:
                      type: string
                - in: query
                  name: date
                  description: Return rates last updated after this specific date. Uses Unix timestamp format.
                  schema:
                      type: number
                - in: query
                  name: prefer
                  example: MIN
                  description: Aggregate rates by currency before converting.
                  schema:
                      type: string
                      enum:
                          - MIN
                          - MAX
                          - MEAN
                          - MEDIAN
                          - MODE
                          - RANDOM
                - in: query
                  name: callback
                  example: callback
                  description: JSONP callback function name. When provided, response will be in JSONP format.
                  schema:
                      type: string
                - in: query
                  name: info
                  example: true
                  description: Whether to include system notice information in the response.
                  schema:
                      type: boolean
            responses:
                '200':
                    description: An object with the base currency, the converted rates and a notice message.
                    headers:
                        Content-Type:
                            schema:
                                type: string
                                oneOf:
                                    - type: string
                                      description: 'Content-Type: application/json'
                                      example: application/json
                                    - type: string
                                      description: 'Content-Type: application/javascript'
                                      example: application/javascript
                        Access-Control-Allow-Origin:
                            schema:
                                type: string
                                example: '*'
                                description: 'Access-Control-Allow-Origin: *'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V2Response'
                            examples:
                                rates:
                                    $ref: '#/components/examples/V2Rates'
                        application/javascript:
                            schema:
                                type: string
                                example: 'callback({...});'
                                description: 'callback({...});'
                '400':
                    description: The base parameter was missing, or a parameter failed validation - for example passing both 'search' and 'name'.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                error:
                                    $ref: '#/components/examples/InvalidParameter'
                '422':
                    description: The base currency exists but its rate is zero or unavailable, so no conversion can be performed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                error:
                                    $ref: '#/components/examples/UnusableBase'
                '500':
                    description: Unexpected server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            tags:
                - Rate
            summary: Get All Rates.
            description: >-
                Same as the GET form; base stays in the path and the remaining
                parameters are sent as a form body.
            parameters:
                - in: path
                  name: base
                  required: true
                  example: ZAR
                  description: >-
                      ISO 4217 code of the currency every rate is returned against, as a
                      path segment. Case insensitive, so /v2/zar and /v2/ZAR are
                      equivalent. A currency with no rates returns an empty list rather
                      than an error.
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            properties:
                                currency:
                                    type: string
                                    example: ZWG
                                    description: Return only this currency, given as an ISO 4217 code. A currency with no rates returns an empty list rather than an error.
                                search:
                                    type: string
                                    example: RBZ
                                    description: Filter rates by name, matching any part of it. Cannot be used with 'name'.
                                name:
                                    type: string
                                    example: RBZ
                                    description: Alias of 'search'. Cannot be used with 'search'.
                                date:
                                    type: number
                                    description: Return rates last updated after this specific date. Uses Unix timestamp format.
                                prefer:
                                    type: string
                                    example: MIN
                                    description: Aggregate rates by currency before converting.
                                    enum:
                                        - MIN
                                        - MAX
                                        - MEAN
                                        - MEDIAN
                                        - MODE
                                        - RANDOM
                                callback:
                                    type: string
                                    example: callback
                                    description: JSONP callback function name. When provided, response will be in JSONP format.
                                info:
                                    type: boolean
                                    example: true
                                    description: Whether to include system notice information in the response.
            responses:
                '200':
                    description: An object with the base currency, the converted rates and a notice message.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V2Response'
                            examples:
                                rates:
                                    $ref: '#/components/examples/V2Rates'
                        application/javascript:
                            schema:
                                type: string
                                example: 'callback({...});'
                                description: 'callback({...});'
                '400':
                    description: The base parameter was missing, or a parameter failed validation.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                error:
                                    $ref: '#/components/examples/InvalidParameter'
                '422':
                    description: The base currency exists but its rate is zero or unavailable.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                            examples:
                                error:
                                    $ref: '#/components/examples/UnusableBase'
                '500':
                    description: Unexpected server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
